# Tests LeanTerm on Windows and builds the installer as a downloadable artifact.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build

      # ConPTY shell, cmd.exe commands, paths and the rest of the backend.
      - name: Go tests
        run: |
          go vet ./internal/...
          go test ./internal/...

      - name: Build installer
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          VERSION=$(node -p "require('./frontend/package.json').version")
          (cd build && wails3 generate syso -arch amd64 -icon windows/icon.ico \
            -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -H windowsgui" -o bin/LeanTerm.exe .
          rm -f wails_windows_amd64.syso
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          # NSIS is not on the PATH of the runner (install it when missing).
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          command -v makensis >/dev/null || { choco install nsis -y --no-progress && export PATH="$PATH:/c/Program Files (x86)/NSIS"; }
          cd build/windows/nsis
          makensis -V2 -DINFO_PRODUCTVERSION="$VERSION" \
            -DARG_WAILS_AMD64_BINARY="$GITHUB_WORKSPACE/bin/LeanTerm.exe" \
            -DOUTFILE="$GITHUB_WORKSPACE/bin/leanterm_${VERSION}_windows_amd64_setup.exe" \
            project.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: leanterm-windows-installer
          path: bin/*_setup.exe
