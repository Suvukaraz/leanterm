# Builds the Linux packages (the Gio GUI with the libghostty engine) and checks
# install.sh on the supported distributions: install, start (--help loads all
# libraries), the leanedit launcher, uninstall.
name: Linux install

on:
  push:
    branches: [main]
    paths: [install.sh, build/package-deb.sh, build/package-tarball.sh, build/linux/**, build/gio/**, cmd/leanterm-native/**, internal/**, third_party/**, '*.go', go.mod, go.sum, .github/workflows/linux-install.yml]
  pull_request:
    paths: [install.sh, build/package-deb.sh, build/package-tarball.sh, build/linux/**, build/gio/**, cmd/leanterm-native/**, internal/**, third_party/**, '*.go', go.mod, go.sum, .github/workflows/linux-install.yml]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.1
  GHOSTTY_COMMIT: 5813c9461d5af78b6307a1254d00b1bc190eaccd

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: version
        run: |
          VERSION=$(grep -m 1 '"version"' frontend/package.json | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: System packages (Gio headers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Zig
        run: |
          pip install ziglang==$ZIG_VERSION
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/bin/zig"
          chmod +x "$HOME/bin/zig"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        id: ghostty-cache
        with:
          path: ${{ runner.temp }}/ghostty
          key: libghostty-vt-linux-${{ env.GHOSTTY_COMMIT }}-zig${{ env.ZIG_VERSION }}

      - name: Build libghostty-vt (Linux)
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: |
          test -f "$RUNNER_TEMP/ghostty/linux/lib/pkgconfig/libghostty-vt-static.pc" ||
            GHOSTTY_SRC="$RUNNER_TEMP/ghostty-src" build/gio/build-libghostty.sh x86_64-linux-gnu.2.34 "$RUNNER_TEMP/ghostty/linux"

      - uses: actions/cache/save@v4
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ghostty
          key: libghostty-vt-linux-${{ env.GHOSTTY_COMMIT }}-zig${{ env.ZIG_VERSION }}

      - name: Build packages
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ghostty/linux/lib/pkgconfig
        run: |
          bash build/package-deb.sh "${{ steps.version.outputs.version }}"
          bash build/package-tarball.sh "${{ steps.version.outputs.version }}"
          mkdir dist
          cp bin/*.deb bin/*.tar.gz install.sh dist/
          (cd dist && sha256sum *.deb *.tar.gz > SHA256SUMS)
          # The binary must not need a newer glibc than 2.34.
          objdump -T bin/leanterm | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            prep: apt-get update -qq && apt-get install -y curl
          - image: ubuntu:24.04
            prep: apt-get update -qq && apt-get install -y curl
          - image: fedora:41
            prep: dnf install -y curl tar gzip
          - image: opensuse/tumbleweed
            prep: zypper -n install curl tar gzip
          - image: archlinux:latest
            prep: pacman -Sy --noconfirm curl tar gzip
    container: ${{ matrix.image }}
    env:
      LEANTERM_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Prepare
        run: ${{ matrix.prep }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist

      - name: Install
        run: LEANTERM_BASE_URL="file://$PWD/dist" sh dist/install.sh

      - name: Check installation
        run: |
          leanterm --help 2>&1 | head -n 1
          leanedit -h >/dev/null 2>&1
          ls /usr/share/applications/org.leanterm.LeanTerm.desktop /usr/local/share/applications/org.leanterm.LeanTerm.desktop 2>/dev/null | grep -q .
          ls /usr/share/applications/org.leanterm.LeanEdit.desktop /usr/local/share/applications/org.leanterm.LeanEdit.desktop 2>/dev/null | grep -q .

      - name: Uninstall
        run: |
          sh dist/install.sh --uninstall
          if command -v leanterm; then echo "leanterm is still installed"; exit 1; fi
          if command -v leanedit; then echo "leanedit is still installed"; exit 1; fi
