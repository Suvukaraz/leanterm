# Demo configuration for the GUI runs of .github/workflows/gio.yml: groups
# (one protected), a favourite, SSH and Telnet connections. Nothing here
# is reachable; the runs only open local shells.

[[groups]]
id = 'a0000000-0000-4000-8000-000000000001'
parent = ''
name = 'Production'
description = 'Live servers'
protected = true

[[groups]]
