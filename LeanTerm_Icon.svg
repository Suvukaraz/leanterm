<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Warmer, erdiger Herbsthintergrund (Dunkelbraun bis Espresso) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22110c" />
      <stop offset="100%" stop-color="#140a07" />
    </linearGradient>
    <!-- Gedecktes Rostbraun/Terracotta für die SFTP-Sidebar -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2117" />
      <stop offset="100%" stop-color="#24130d" />
    </linearGradient>
  </defs>

  <!-- Hintergrundfläche (ohne Stroke – der Rand kommt ganz zum Schluss) -->
  <rect x="16" y="16" width="224" height="224" rx="44" fill="url(#bgGrad)" />

  <!-- SFTP-Sidebar: exakt dieselbe Außenkontur wie der Rahmen
       (Kante bei x=16, Eckradius 44, Bogenmittelpunkte (60,60) bzw. (60,196)).
       Kein clipPath nötig → funktioniert auch in Qt SVG (Gwenview, KDE-Icons). -->
  <path d="M 60 16 L 94 16 L 94 240 L 60 240 A 44 44 0 0 1 16 196 L 16 60 A 44 44 0 0 1 60 16 Z" fill="url(#sideGrad)" />

  <!-- Trennlinie zwischen SFTP und SSH (Enden liegen unter dem Rahmenstrich) -->
  <line x1="94" y1="16" x2="94" y2="240" stroke="#5c3826" stroke-width="4" />

  <!-- SFTP-Verzeichnisbaum (Links in herbstlichen Orange- und Ockertönen) -->
  <rect x="36" y="64" width="38" height="11" rx="5.5" fill="#d95d1e" /> <!-- Kürbisorange -->
  <rect x="46" y="90" width="28" height="9" rx="4.5" fill="#f4a261" opacity="0.8" /> <!-- Sand/Ocker -->
  <rect x="46" y="114" width="28" height="9" rx="4.5" fill="#f4a261" opacity="0.8" />
  <rect x="36" y="138" width="38" height="11" rx="5.5" fill="#d95d1e" />
  <rect x="46" y="164" width="22" height="9" rx="4.5" fill="#e9c46a" opacity="0.85" /> <!-- Weizengold -->

  <!-- SSH Terminal Prompt ">_" -->
  <!-- Pfeil ">" in Rostrot/Terracotta -->
  <path d="M 126 96 L 162 128 L 126 160" fill="none" stroke="#e76f51" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cursor "_" in warmem Herbstgold -->
  <line x1="174" y1="160" x2="206" y2="160" stroke="#f4a261" stroke-width="18" stroke-linecap="round" />

  <!-- Außenrahmen als LETZTES Element: liegt über allem, daher überall volle 6px Strichstärke -->
  <rect x="16" y="16" width="224" height="224" rx="44" fill="none" stroke="#5c3826" stroke-width="6" />
</svg>
